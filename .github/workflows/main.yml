# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  # The lines plugin crashes on repositories having a deleted (ghost) account among contributors:
  # detect them so they can be skipped
  prepare:
    runs-on: ubuntu-latest
    outputs:
      lines_skipped: ${{ steps.ghosts.outputs.skipped }}
    steps:
      - id: ghosts
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          skipped=""
          for repo in $(gh api --paginate "users/Triskae/repos?type=owner&per_page=100" --jq '.[] | select(.fork | not) | .name'); do
            if gh api "repos/Triskae/$repo/stats/contributors" --jq 'type == "array" and any(.[]; .author == null)' 2>/dev/null | grep -q true; then
              skipped="$skipped,$repo"
            fi
          done
          echo "Skipped repositories: ${skipped#,}"
          echo "skipped=${skipped#,}" >> "$GITHUB_OUTPUT"

  # Terminal card (main image of the README)
  github-metrics-terminal:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@master
        with:
          filename: github-metrics-terminal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Triskae
          template: terminal
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_skipped: ${{ needs.prepare.outputs.lines_skipped }}

  # Classic card (full details)
  github-metrics:
    # Avoid concurrent commits on the same branch
    needs: [prepare, github-metrics-terminal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@master
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Triskae
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used, recently-used
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_skipped: ${{ needs.prepare.outputs.lines_skipped }}
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following
          plugin_reactions: yes
          plugin_reactions_display: absolute
          plugin_reactions_limit: 200
          plugin_reactions_limit_discussions: 100
          plugin_reactions_limit_discussions_comments: 100
          plugin_reactions_limit_issues: 100
          plugin_repositories: yes
          plugin_repositories_featured: ha_ocea_smart_building, esphome-petkit-element-solo, hytale-jei, home-assistant-ics-extranet
          plugin_repositories_order: featured
          plugin_stars: yes
          plugin_stars_limit: 4
